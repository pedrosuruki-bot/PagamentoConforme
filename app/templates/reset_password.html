{% extends "base.html" %}
{% block title %}Definir palavra-passe — PagamentoConforme{% endblock %}
{% block body %}<main class="wrap auth-wrap"><section class="auth-card"><p class="eyebrow">RECUPERAÇÃO SEGURA</p><h1>Definir nova palavra-passe</h1><p class="muted">A ligação expira após 60 minutos.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/reset-password"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><div class="field"><label for="password">Nova palavra-passe</label><input id="password" name="password" type="password" required minlength="12" autocomplete="new-password"></div><div class="field"><label for="password_confirm">Confirmar palavra-passe</label><input id="password_confirm" name="password_confirm" type="password" required minlength="12" autocomplete="new-password"></div><button class="btn" type="submit" style="width:100%">Alterar palavra-passe</button></form></section></main>{% endblock %}
